<!-- Data hub home replica: the two chart containers taxo-graph.js and inst-graph.js look for,
     plus the banner that loads init.js. The charts call $.getJSON, so the page brings the
     jQuery the branding ships, as a real hub page does: the banner's own jquery-fallback.js
     only steps in on a CAS page (it keys off the webjars.jquerymin.js script tag).
     The ALA_BANNER / ALA_FOOTER markers are replaced by dist/banner.html and dist/footer.html;
     HEADER_FOOTER_URL is the branding base. -->
<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Hub home</title>
  <link rel="stylesheet" href="HEADER_FOOTER_URL/css/bootstrap.min.css" media="screen,print"/>
  <script type="text/javascript" src="HEADER_FOOTER_URL/js/jquery.min.js"></script>
</head>
<body>
<!--ALA_BANNER-->
<div class="container">
  <div id="taxo-container" style="width: 600px; height: 400px"></div>
  <div id="inst-container" style="width: 600px; height: 400px"></div>
</div>
<!--ALA_FOOTER-->
</body>
</html>
